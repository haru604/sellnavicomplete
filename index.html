<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>セルナビ</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="セルナビ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<meta name="description" content="店舗実績を入力・分析・共有できるセルナビ">
<link rel="manifest" href="./manifest.json" type="application/manifest+json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --bg:#0d0f14;--surface:#161a23;--surface2:#1e2330;--border:#2a3045;
    --accent:#3b82f6;--accent2:#6366f1;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;
    --text:#e8ecf4;--text2:#8b95a9;--text3:#4d5771;--tab-h:62px;--header-h:52px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP',sans-serif;font-size:15px;}
  #app{display:flex;flex-direction:column;height:100%;}
  .header{background:var(--surface);border-bottom:1px solid var(--border);height:var(--header-h);display:flex;align-items:center;padding:0 16px;flex-shrink:0;}
  .header h1{font-size:16px;font-weight:700;letter-spacing:.03em;}
  .header-sub{font-size:12px;color:var(--text2);margin-left:8px;}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tab-h)+8px);}
  .tab-bar{position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;border:none;background:none;transition:color .15s;}
  .tab-btn.active{color:var(--accent);}
  .tab-btn svg{width:22px;height:22px;}
  .page{display:none;}
  .page.active{display:block;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:12px 14px;}
  .section-label{font-size:11px;font-weight:600;color:var(--accent2);letter-spacing:.06em;padding:16px 14px 6px;}

  /* input */
  .date-row{align-items:center;gap:10px;padding:14px;}
  .date-row label{font-size:13px;color:var(--text2);white-space:nowrap;}
  .date-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:9px 12px;-webkit-appearance:none;}
  .date-input:focus{outline:none;border-color:var(--accent);}
  .metric-block{border-bottom:1px solid var(--border);}
  .metric-block:last-child{border-bottom:none;}
  .metric-row{display:flex;align-items:center;padding:0 14px;min-height:52px;}
  .metric-name{flex:1;font-size:14px;display:flex;align-items:center;gap:7px;min-width:0;}
  .guide-btn{border:1px solid var(--border);background:var(--surface2);color:var(--accent);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700;white-space:nowrap;cursor:pointer;}
  .guide-panel{display:none;margin:-2px 14px 10px;padding:9px 10px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.22);border-radius:8px;color:var(--text2);font-size:12px;line-height:1.55;}
  .guide-panel.show{display:block;}
  .metric-unit{font-size:11px;color:var(--text3);margin-right:8px;}
  .counter-wrap{display:flex;align-items:center;}
  .cnt-btn{width:36px;height:36px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:22px;line-height:1;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:300;flex-shrink:0;}
  .cnt-val input{width:68px;text-align:center;background:transparent;border:none;color:var(--text);font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums;}
  .save-btn-wrap{position:fixed;bottom:var(--tab-h);left:0;right:0;padding:10px 14px;background:var(--bg);border-top:1px solid var(--border);z-index:99;}
  .save-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;height:50px;font-size:16px;font-weight:700;cursor:pointer;}
  .save-btn:active{filter:brightness(.85);}
  .inp-hint{font-size:11px;color:var(--text3);padding:0 14px 10px;line-height:1.6;}

  /* history */
  .cal-header{display:flex;align-items:center;justify-content:space-between;padding:14px;}
  .cal-month{font-size:16px;font-weight:700;cursor:pointer;}
  .cal-nav{background:none;border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px 10px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;font-weight:600;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;}
  .cal-day.has-data{background:var(--surface2);color:var(--accent);font-weight:700;}
  .cal-day.today{border:1px solid var(--accent2);}
  .cal-day.other-month{color:var(--text3);}
  .detail-box{background:var(--surface2);border-radius:10px;margin:0 14px 14px;padding:12px 14px;}
  .detail-box h3{font-size:14px;font-weight:700;margin-bottom:10px;}
  .detail-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);}
  .detail-row:last-child{border-bottom:none;}
  .detail-key{font-size:13px;color:var(--text2);}
  .detail-vals{display:flex;gap:12px;}
  .detail-val{font-size:13px;font-variant-numeric:tabular-nums;font-weight:600;}
  .diff-pos{color:var(--ok);font-size:12px;}
  .diff-neg{color:var(--danger);font-size:12px;}
  .diff-zero{color:var(--text3);font-size:12px;}
  .summary-box{background:var(--surface2);border-radius:10px;margin:0 14px 14px;padding:12px 14px;}
  .summary-box h3{font-size:14px;font-weight:700;margin-bottom:10px;}
  .sum-row{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid var(--border);}
  .sum-row:last-child{border-bottom:none;}
  .sum-row-top{display:flex;justify-content:space-between;align-items:center;}
  .sum-key{font-size:13px;}
  .sum-right{display:flex;gap:8px;align-items:center;}
  .sum-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
  .sum-pct{font-size:11px;color:var(--text2);}
  .sum-remain{font-size:11px;color:var(--warn);}
  .sum-over{font-size:11px;color:var(--ok);}
  .pbar{height:3px;background:var(--border);border-radius:2px;margin-top:4px;}
  .pbar-fill{height:100%;border-radius:2px;}

  /* analysis */
  .analysis-item{padding:12px 14px;border-bottom:1px solid var(--border);}
  .analysis-item:last-child{border-bottom:none;}
  .analysis-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .analysis-name{font-size:14px;font-weight:700;}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .badge.red{background:rgba(239,68,68,.2);color:var(--danger);}
  .badge.yellow{background:rgba(245,158,11,.2);color:var(--warn);}
  .badge.green{background:rgba(34,197,94,.15);color:var(--ok);}
  .analysis-stats{display:flex;gap:12px;font-size:12px;color:var(--text2);flex-wrap:wrap;}
  .analysis-pbar{margin-top:6px;height:4px;background:var(--border);border-radius:2px;}
  .analysis-pbar-fill{height:100%;border-radius:2px;}

  /* LINE */
  .line-editor{display:block;width:calc(100% - 28px);min-height:430px;margin:0 14px;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;resize:vertical;white-space:pre-wrap;font-size:14px;line-height:1.9;font-family:monospace;color:var(--text);outline:none;}
  .line-editor:focus{border-color:var(--accent);}
  .line-sub-btn{height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;}
  .copy-btn{width:calc(100% - 28px);margin:10px 14px 0;background:#06c755;color:#fff;border:none;border-radius:10px;height:48px;font-size:16px;font-weight:700;cursor:pointer;}
  .copy-btn:active,.line-sub-btn:active{filter:brightness(.85);}
  .copy-toast{text-align:center;font-size:13px;color:var(--ok);padding:4px;min-height:24px;}
  .save-status{font-size:11px;color:var(--text3);text-align:center;padding:5px 14px 0;}

  /* settings */
  .setting-row{display:flex;align-items:center;padding:0 14px;min-height:48px;border-bottom:1px solid var(--border);}
  .setting-row:last-child{border-bottom:none;}
  .setting-name{flex:1;font-size:14px;}
  .setting-unit{font-size:11px;color:var(--text3);margin-right:8px;}
  .setting-input{width:80px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:15px;text-align:right;padding:7px 10px;border-radius:8px;}
  .setting-input:focus{outline:none;border-color:var(--accent);}
  .settings-save-btn{width:calc(100% - 28px);margin:8px 14px 14px;background:var(--accent);color:#fff;border:none;border-radius:10px;height:48px;font-size:16px;font-weight:700;cursor:pointer;}
  .settings-save-btn:active{filter:brightness(.85);}
  .info-chip{font-size:11px;color:var(--accent2);background:rgba(99,102,241,.12);border-radius:6px;padding:2px 7px;margin-left:6px;}
  .empty-msg{text-align:center;color:var(--text3);font-size:14px;padding:32px;}
  .sync-note{font-size:12px;color:var(--text2);line-height:1.65;padding:10px 14px 2px;}
  .sync-field{padding:10px 14px;border-bottom:1px solid var(--border);}
  .sync-field label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;}
  .sync-field input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;padding:10px;border-radius:8px;outline:none;}
  .sync-field input:focus{border-color:var(--accent);}
  .sync-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;}
  .sync-btn{height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;}
  .sync-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .sync-status{font-size:11px;color:var(--text3);padding:0 14px 12px;line-height:1.5;}

  /* PWA / full-screen */
  body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
  .tab-bar{padding-bottom:env(safe-area-inset-bottom);height:calc(var(--tab-h) + env(safe-area-inset-bottom));}
  .content{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 8px);}
  .pwa-status{font-size:12px;color:var(--text2);line-height:1.6;padding:12px 14px;}
  .install-btn{width:calc(100% - 28px);margin:0 14px 14px;background:var(--ok);color:#fff;border:none;border-radius:10px;height:48px;font-size:16px;font-weight:700;cursor:pointer;}
  .install-btn[disabled]{background:var(--surface2);color:var(--text3);cursor:default;}
  .install-banner{display:none;margin:10px 14px 0;background:linear-gradient(135deg,#1d4ed8,#2563eb);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.24);}
  .install-banner.show{display:flex;}
  .install-banner-text{flex:1;min-width:0;}
  .install-banner-title{font-size:14px;font-weight:800;color:#fff;}
  .install-banner-sub{font-size:11px;line-height:1.45;color:rgba(255,255,255,.82);margin-top:2px;}
  .install-banner-btn{border:none;border-radius:9px;background:#fff;color:#1d4ed8;font-size:13px;font-weight:800;padding:10px 12px;white-space:nowrap;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>セルナビ</h1>
    <span class="header-sub" id="header-period"></span>
  </div>
  <div class="install-banner" id="install-banner">
    <div class="install-banner-text">
      <div class="install-banner-title">セルナビをアプリとして使う</div>
      <div class="install-banner-sub" id="install-banner-sub">ホーム画面へインストールすると全画面で起動できます</div>
    </div>
    <button class="install-banner-btn" id="install-banner-btn" onclick="installPWA()">インストール</button>
  </div>
  <div class="content" id="content">
    <div class="page active" id="page-input"></div>
    <div class="page" id="page-history"></div>
    <div class="page" id="page-analysis"></div>
    <div class="page" id="page-line"></div>
    <div class="page" id="page-settings"></div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="input" onclick="switchTab('input')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M12 8v8"/></svg>
      入力
    </button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      履歴
    </button>
    <button class="tab-btn" data-tab="analysis" onclick="switchTab('analysis')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l5-8 4 4 5-8 4 4"/></svg>
      分析
    </button>
    <button class="tab-btn" data-tab="line" onclick="switchTab('line')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5C21 16.75 16.25 21 12 21c-1.5 0-3.5-.5-5-1.5L3 21l1.5-4C3.5 15.5 3 13.5 3 11.5 3 6.25 7.75 2 12 2s9 4.25 9 9.5z"/></svg>
      LINE
    </button>
    <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      設定
    </button>
  </div>
</div>
<script>
// ══════════════════════════════════════════
// ユーティリティ
// ══════════════════════════════════════════
function fmt(v) {
  if (v===null||v===undefined) return '0';
  const n=parseFloat(v);
  if (isNaN(n)) return '0';
  return parseFloat(n.toFixed(1)).toString();
}
function parseVal(s) {
  const normalized=String(s??'').replace(/,/g,'').trim();
  const n=parseFloat(normalized);
  return isNaN(n)?0:parseFloat(n.toFixed(1));
}
function parseTargetVal(s) {
  return Math.max(0,parseVal(s));
}
function isMoneyMetric(metricOrKey) {
  const key=typeof metricOrKey==='string'?metricOrKey:metricOrKey?.key;
  return key==='paidSupport'||key==='plus1Collection';
}
function fmtMetric(v,metricOrKey) {
  const base=fmt(v);
  return isMoneyMetric(metricOrKey)?Number(base).toLocaleString('ja-JP'):base;
}

// ══════════════════════════════════════════
// DATA MODEL
// ══════════════════════════════════════════
// データ構造：
// {
//   "2025-06-20": { shinki:150, kishu:120, ... },  ← 各日の「その時点の累計実績」
//   "2025-06-22": { shinki:160, kishu:135, ... },  ← 最新値で上書き
// }
// 集計時は各月の「最も新しい日付のデータ」を使う

const METRICS = [
  { key:'shinki',   name:'新規',      unit:'台', monthly:true  },
  { key:'ltv',      name:'LTV',       unit:'pt', monthly:true  },
  { key:'supportFlat', name:'サポート定額', unit:'件', monthly:true },
  { key:'paidSupport', name:'有償サポート', unit:'円', monthly:true },
  { key:'plus1Collection', name:'+1Collection', unit:'円', monthly:true },
  { key:'kishu',    name:'機種変更',   unit:'台', monthly:false },
  { key:'celup',    name:'セルアップ', unit:'台', monthly:false },
  { key:'tab',      name:'タブ',       unit:'件', monthly:false },
  { key:'nw',       name:'NW',         unit:'点', monthly:false },
  { key:'wimax',    name:'WiMAX',      unit:'台', monthly:false },
  { key:'denki',    name:'でんき',     unit:'件', monthly:false },
  { key:'kurekka',  name:'クレカ',     unit:'件', monthly:false },
  { key:'gold',     name:'内ゴールド', unit:'件', monthly:false },
  { key:'jibun',    name:'じぶん銀行', unit:'件', monthly:false },
  { key:'setai',    name:'世帯商材',   unit:'件', monthly:false },
  { key:'kojin',    name:'個人商材',   unit:'件', monthly:false },
  { key:'certified',name:'certified',  unit:'台', monthly:false },
];

const DEFAULT_TARGETS = {
  shinki:540, ltv:null, supportFlat:60, paidSupport:300000, plus1Collection:4000000, kishu:340, celup:80, tab:4,
  nw:230, wimax:6, denki:10, kurekka:45, gold:20,
  jibun:25, setai:10, kojin:95, certified:5
};

const QUARTERS = [
  { name:'Q1', months:[5,6,7]  },
  { name:'Q2', months:[8,9,10] },
  { name:'Q3', months:[11,0,1] },
  { name:'Q4', months:[2,3,4]  },
];

function getQuarter(year,month) {
  for (const q of QUARTERS) { if (q.months.includes(month)) return q; }
  return null;
}
function getQuarterMonths(year,month) {
  const q=getQuarter(year,month);
  if (!q) return [];
  return q.months.map(m => {
    let y=year;
    if (month<=1&&m>=11) y=year-1;
    if (month>=11&&m<=1) y=year+1;
    return {year:y,month:m};
  });
}
function getElapsedMonthsInQuarter(year,month) {
  const q=getQuarter(year,month);
  if (!q) return 1;
  return q.months.indexOf(month)+1;
}

function loadData() { try{return JSON.parse(localStorage.getItem('sellnavi_data')||'{}')}catch{return{}} }
function saveData(data) { localStorage.setItem('sellnavi_data',JSON.stringify(data)); if(typeof scheduleCloudPush==='function') scheduleCloudPush(); }
function loadTargets() { try{const saved=JSON.parse(localStorage.getItem('sellnavi_targets')||'null')||{};return {...DEFAULT_TARGETS,...saved}}catch{return{...DEFAULT_TARGETS}} }
function saveTargets(t) { localStorage.setItem('sellnavi_targets',JSON.stringify(t)); if(typeof scheduleCloudPush==='function') scheduleCloudPush(); }

function dateKey(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

// ══════════════════════════════════════════
// 集計ロジック（最新値上書き方式）
// ──────────────────────────────────────────
// 各月の「最も新しい日付のエントリ」の値を
// その月の実績として使う
// ══════════════════════════════════════════

// 指定月の最新実績を返す（その月のデータがなければ全0）
function getMonthLatest(data, year, month) {
  const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
  // その月の全エントリを取得してソート
  const keys = Object.keys(data).filter(k=>k.startsWith(prefix)).sort();
  const empty = {};
  METRICS.forEach(m=>empty[m.key]=0);
  if (!keys.length) return empty;
  // 最新日付の値を返す
  return {...empty, ...data[keys[keys.length-1]]};
}

// 四半期の集計：
// - 単月項目（新規・LTV）：当月最新値のみ
// - 四半期項目：前月までの最終値 + 今月の最新値
function getQuarterActual(data, year, month) {
  const q = getQuarter(year, month);
  if (!q) return getMonthLatest(data, year, month);

  const result = {};
  METRICS.forEach(m=>result[m.key]=0);

  q.months.forEach((mo, idx) => {
    let y = year;
    if (month<=1&&mo>=11) y=year-1;
    if (month>=11&&mo<=1) y=year+1;

    // 現在月より後の月はスキップ
    const thisMk = y*100+mo;
    const curMk = year*100+month;
    if (thisMk > curMk) return;

    const latest = getMonthLatest(data, y, mo);
    METRICS.forEach(m => {
      if (m.monthly) {
        // 単月項目は当月のみ
        if (y===year && mo===month) result[m.key] = latest[m.key]||0;
      } else {
        // 四半期項目は各月の最新値を足す
        result[m.key] = parseFloat((result[m.key] + (latest[m.key]||0)).toFixed(1));
      }
    });
  });

  return result;
}

function getPeriodLabel(year,month) {
  const q=getQuarter(year,month);
  const now=new Date();
  const label=(now.getFullYear()===year&&now.getMonth()===month)?'今月':`${month+1}月`;
  return q?`${label} / ${q.name}`:label;
}

function remainLabel(actual,totalTarget,unit,metric) {
  if (totalTarget===null||totalTarget===undefined) return `${fmtMetric(actual,metric)}${unit}`;
  const diff=parseFloat((actual-totalTarget).toFixed(1));
  if (diff>0) return `+${fmtMetric(diff,metric)}${unit}`;
  if (diff===0) return '達成';
  return `残${fmtMetric(totalTarget-actual,metric)}${unit}`;
}

const DOWS=['日','月','火','水','木','金','土'];
const MONTHS_JP=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function renderHistory() {
  const el=document.getElementById('page-history');
  const data=loadData();
  const now=new Date();
  const firstDay=new Date(historyYear,historyMonth,1).getDay();
  const daysInMonth=new Date(historyYear,historyMonth+1,0).getDate();
  const daysInPrev=new Date(historyYear,historyMonth,0).getDate();
  let daysCells='';
  for(let i=firstDay-1;i>=0;i--) daysCells+=`<div class="cal-day other-month">${daysInPrev-i}</div>`;
  for(let d=1;d<=daysInMonth;d++) {
    const dk=dateKey(historyYear,historyMonth,d);
    const hasData=!!data[dk];
    const isToday=now.getFullYear()===historyYear&&now.getMonth()===historyMonth&&now.getDate()===d;
    const isSelected=historySelectedDate===dk;
    daysCells+=`<div class="cal-day${hasData?' has-data':''}${isToday?' today':''}" style="${isSelected?'background:var(--accent);color:#fff;':''}" onclick="selectDay('${dk}')">${d}</div>`;
  }
  const total=Math.ceil((firstDay+daysInMonth)/7)*7;
  for(let i=1;i<=total-firstDay-daysInMonth;i++) daysCells+=`<div class="cal-day other-month">${i}</div>`;
  let summaryHTML=historyShowSummary?buildMonthlySummaryHTML(data,historyYear,historyMonth):'';
  let detailHTML=(historySelectedDate&&data[historySelectedDate])?buildDetailHTML(data,historySelectedDate):'';
  el.innerHTML=`
    <div class="card">
      <div class="cal-header">
        <button class="cal-nav" onclick="changeHistoryMonth(-1)">‹</button>
        <span class="cal-month" onclick="toggleSummary()">${historyYear}年 ${MONTHS_JP[historyMonth]} ▾</span>
        <button class="cal-nav" onclick="changeHistoryMonth(1)">›</button>
      </div>
      <div class="cal-grid">
        ${DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${daysCells}
      </div>
    </div>
    ${summaryHTML}${detailHTML}
    <div style="height:80px"></div>`;
}

function changeHistoryMonth(delta) {
  historyMonth+=delta;
  if(historyMonth<0){historyMonth=11;historyYear--;}
  if(historyMonth>11){historyMonth=0;historyYear++;}
  historySelectedDate=null;historyShowSummary=false;
  renderHistory();
}
function toggleSummary(){historyShowSummary=!historyShowSummary;historySelectedDate=null;renderHistory();}
function selectDay(dk){historySelectedDate=historySelectedDate===dk?null:dk;historyShowSummary=false;renderHistory();}

function editHistoryDate(dk){
  inputDate=dk;
  switchTab('input');
}
function deleteHistoryDate(dk){
  if(!confirm(`${dk.replace(/-/g,'/')} の実績を削除しますか？`)) return;
  const data=loadData();
  delete data[dk];
  saveData(data);
  historySelectedDate=null;
  renderHistory();
  showToast('削除しました');
}

function buildDetailHTML(data,dk) {
  const dayData=data[dk];
  const dateObj=new Date(dk+'T00:00:00');
  const label=`${dateObj.getMonth()+1}/${dateObj.getDate()}（${DOWS[dateObj.getDay()]}）`;
  // 前回の入力日を探す
  const sortedKeys=Object.keys(data).filter(k=>k<dk).sort();
  const prevKey=sortedKeys.length?sortedKeys[sortedKeys.length-1]:null;
  const prevData=prevKey?data[prevKey]:null;
  const rows=METRICS.map(m=>{
    const val=parseFloat(dayData[m.key])||0;
    let diffHTML='';
    if(prevData!==null){
      const prev=parseFloat(prevData[m.key])||0;
      const diff=parseFloat((val-prev).toFixed(1));
      if(diff>0) diffHTML=`<span class="diff-pos">+${fmt(diff)}</span>`;
      else if(diff<0) diffHTML=`<span class="diff-neg">${fmt(diff)}</span>`;
      else diffHTML=`<span class="diff-zero">ー</span>`;
    }
    return `<div class="detail-row">
      <span class="detail-key">${m.name}</span>
      <div class="detail-vals">
        ${diffHTML}
        <span class="detail-val">${fmtMetric(val,m)}<small style="font-size:10px;color:var(--text3);font-weight:400"> ${m.unit}</small></span>
      </div>
    </div>`;
  }).join('');
  const prevLabel=prevKey?`前回：${prevKey.replace(/-/g,'/')}`:'';
  return `<div class="detail-box">
    <h3>${label} の実績 <small style="font-size:11px;color:var(--text3)">${prevLabel}</small></h3>
    ${rows}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <button class="line-sub-btn" onclick="editHistoryDate('${dk}')">この日を編集</button>
      <button class="line-sub-btn" style="color:var(--danger)" onclick="deleteHistoryDate('${dk}')">この日を削除</button>
    </div>
  </div>`;
}

function buildMonthlySummaryHTML(data,year,month) {
  const targets=loadTargets();
  const elapsed=getElapsedMonthsInQuarter(year,month);
  const q=getQuarter(year,month);
  const actual=getQuarterActual(data,year,month);

  const rows=METRICS.map(m=>{
    const val=actual[m.key]||0;
    const target=targets[m.key];
    if(target===null||target===undefined){
      return `<div class="sum-row"><div class="sum-row-top"><span class="sum-key">${m.name}</span><div class="sum-right"><span class="sum-val">${fmtMetric(val,m)}${m.unit}</span><span class="sum-pct">目標なし</span></div></div></div>`;
    }
    const totalTarget=m.monthly?target:target*elapsed;
    const pct=totalTarget>0?val/totalTarget*100:0;
    const diff=parseFloat((val-totalTarget).toFixed(1));
    const remain=parseFloat((totalTarget-val).toFixed(1));
    const avg=elapsed>0?parseFloat((val/elapsed).toFixed(1)):val;
    const fillColor=pct>=100?'var(--ok)':pct>=70?'var(--warn)':'var(--danger)';
    let remainEl='';
    if(diff>0) remainEl=`<span class="sum-over">+${fmtMetric(diff,m)}${m.unit}</span>`;
    else if(remain===0) remainEl=`<span class="sum-over">達成</span>`;
    else remainEl=`<span class="sum-remain">残${fmtMetric(remain,m)}${m.unit}</span>`;
    return `<div class="sum-row">
      <div class="sum-row-top">
        <span class="sum-key">${m.name}</span>
        <div class="sum-right">${remainEl}<span class="sum-val">${fmtMetric(val,m)}/${fmtMetric(totalTarget,m)}</span><span class="sum-pct">${Math.round(pct)}%</span></div>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${Math.min(pct,100)}%;background:${fillColor}"></div></div>
      <div style="font-size:11px;color:var(--text3);margin-top:3px">平均 ${fmtMetric(avg,m)}${m.unit}${!m.monthly?` / 月（${elapsed}ヶ月）`:''}</div>
    </div>`;
  }).join('');
  const qLabel=q?` / ${q.name}（${elapsed}ヶ月目）`:'';
  return `<div class="summary-box"><h3>${MONTHS_JP[month]} サマリー${qLabel}</h3>${rows}</div>`;
}

function renderAnalysis() {
  const el=document.getElementById('page-analysis');
  const data=loadData();
  const targets=loadTargets();
  const now=new Date();
  const year=now.getFullYear(),month=now.getMonth();
  const elapsed=getElapsedMonthsInQuarter(year,month);
  const actual=getQuarterActual(data,year,month);

  const items=METRICS.filter(m=>targets[m.key]!==null&&targets[m.key]!==undefined).map(m=>{
    const val=actual[m.key]||0;
    const totalTarget=m.monthly?targets[m.key]:targets[m.key]*elapsed;
    const pct=totalTarget>0?val/totalTarget*100:0;
    const diff=parseFloat((val-totalTarget).toFixed(1));
    const remain=parseFloat((totalTarget-val).toFixed(1));
    const avg=elapsed>0?parseFloat((val/elapsed).toFixed(1)):val;
    return {...m,actual:val,totalTarget,pct,diff,remain,avg};
  }).sort((a,b)=>a.pct-b.pct);

  const cards=items.map(item=>{
    const pct=Math.round(item.pct);
    let badgeClass='red',badgeLabel='要注意',fillColor='var(--danger)';
    if(pct>=100){badgeClass='green';badgeLabel='達成';fillColor='var(--ok)';}
    else if(pct>=70){badgeClass='yellow';badgeLabel='注意';fillColor='var(--warn)';}
    let remainText='';
    if(item.diff>0) remainText=`<b style="color:var(--ok)">+${fmtMetric(item.diff,item)}${item.unit}</b>`;
    else if(item.remain===0) remainText=`<b style="color:var(--ok)">達成</b>`;
    else remainText=`<b style="color:var(--warn)">残${fmtMetric(item.remain,item)}${item.unit}</b>`;
    return `<div class="analysis-item">
      <div class="analysis-head"><span class="analysis-name">${item.name}</span><span class="badge ${badgeClass}">${badgeLabel}</span></div>
      <div class="analysis-stats">
        <span>実績 <b>${fmtMetric(item.actual,item)}${item.unit}</b></span>
        <span>${remainText}</span>
        <span>平均 <b>${fmtMetric(item.avg,item)}${item.unit}</b></span>
        <span>進捗 <b>${pct}%</b></span>
      </div>
      <div class="analysis-pbar"><div class="analysis-pbar-fill" style="width:${Math.min(pct,100)}%;background:${fillColor}"></div></div>
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="section-label" style="padding-bottom:4px">今月 / ${getQuarter(year,month)?.name||''}（${elapsed}ヶ月目）― 危険度順</div>
    <div class="card">${cards||'<div class="empty-msg">データなし</div>'}</div>
    <div style="height:80px"></div>`;
}

const LINE_TEXT_KEY='sellnavi_line_text';

function loadLineText(){
  const saved=localStorage.getItem(LINE_TEXT_KEY);
  if(saved!==null) return saved;
  const initial=buildLineText();
  localStorage.setItem(LINE_TEXT_KEY,initial);
  return initial;

function saveLineText(text){
  localStorage.setItem(LINE_TEXT_KEY,text);
  if(typeof scheduleCloudPush==='function') scheduleCloudPush();
  const status=document.getElementById('line-save-status');
  if(status) status.textContent='自動保存しました';
}
function renderLine() {
  const el=document.getElementById('page-line');
  refreshLineNumbersInStorage();
  const text=loadLineText();
  el.innerHTML=`
    <div class="section-label">LINE 共有テキスト</div>
    <div class="inp-hint">文章の追加・削除・改行はそのまま保存。実績数字は入力データから自動で最新化されます</div>
    <textarea class="line-editor" id="line-editor" oninput="saveLineText(this.value)">${escHtml(text)}</textarea>
    <div class="save-status" id="line-save-status">自動保存済み / 数字は自動更新</div>
    <button class="copy-btn" onclick="copyLine()">📋 編集した文章をコピー</button>
    <div class="copy-toast" id="copy-toast"></div>
    <div style="height:80px"></div>`;
}

function buildLineMetricLines(){
  const data=loadData();
  const targets=loadTargets();
  const now=new Date();
  const year=now.getFullYear(),month=now.getMonth();
  const elapsed=getElapsedMonthsInQuarter(year,month);
  const actual=getQuarterActual(data,year,month);
  const map={};
  METRICS.forEach(m=>{
    const target=targets[m.key];
    const val=actual[m.key]||0;
    const totalTarget=(target!==null&&target!==undefined)?(m.monthly?target:target*elapsed):null;
    map[m.name]=`${m.name}　${remainLabel(val,totalTarget,m.unit,m)}`;
  });
  return map;
}
function buildLineText() {
  const now=new Date();
  const month=now.getMonth(),day=now.getDate();
  const dow=DOWS[now.getDay()];
  const metricLines=buildLineMetricLines();
  const lines=[`お疲れ様です`,`セルナビの実績共有です`,``,`${month+1}月${day}日（${dow}）`,``];
  METRICS.forEach(m=>lines.push(metricLines[m.name]));
  return lines.join('\n');
}
function applyLatestNumbersToLineText(text){
  const metricLines=buildLineMetricLines();
  const existing=String(text||'').split('\n');
  const found=new Set();
  const updated=existing.map(line=>{
    const metric=METRICS.find(m=>line.trimStart().startsWith(m.name));
    if(!metric) return line;
    found.add(metric.name);
    const indent=line.match(/^\s*/)?.[0]||'';
    return indent+metricLines[metric.name];
  });
  const missing=METRICS.filter(m=>!found.has(m.name));
  if(missing.length){
    if(updated.length&&updated[updated.length-1]!=='') updated.push('');
    missing.forEach(m=>updated.push(metricLines[m.name]));
  }
  return updated.join('\n');
}
function refreshLineNumbersInStorage(){
  const current=loadLineText();
  const updated=applyLatestNumbersToLineText(current);
  if(updated!==current) localStorage.setItem(LINE_TEXT_KEY,updated);
  const editor=document.getElementById('line-editor');
  if(editor && editor.value!==updated) editor.value=updated;
  return updated;
}
function updateLineNumbers(){ refreshLineNumbersInStorage(); }

function resetLineText(){
  if(!confirm('現在の編集内容を消して、最新の日付・実績から基本文を作り直しますか？')) return;
  const text=buildLineText();
  const editor=document.getElementById('line-editor');
  if(editor) editor.value=text;
  saveLineText(text);
  showCopyToast('基本文を再生成しました ✓');
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyLine(){
  const editor=document.getElementById('line-editor');
  const text=editor?editor.value:loadLineText();
  saveLineText(text);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>showCopyToast('コピーしました ✓')).catch(()=>fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');showCopyToast('コピーしました ✓');}catch{}
  document.body.removeChild(ta);
}
function showCopyToast(message='コピーしました ✓'){
  const el=document.getElementById('copy-toast');
  if(el){el.textContent=message;setTimeout(()=>{if(el)el.textContent='';},2000);}
}

// ══════════════════════════════════════════
// CLOUD SYNC (Supabase REST)
// ══════════════════════════════════════════
const SYNC_CONFIG_KEY='sellnavi_sync_config';
const SYNC_LAST_CLOUD_KEY='sellnavi_sync_last_cloud_updated';
let cloudPushTimer=null;
let cloudSyncReady=false;
let cloudPollTimer=null;

function loadSyncConfig(){
  try{return JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY)||'{}')||{}}catch{return{}}
}
function saveSyncConfig(config){
  localStorage.setItem(SYNC_CONFIG_KEY,JSON.stringify(config));
}
function syncConfigured(){
  const c=loadSyncConfig();
  return !!(c.url&&c.key&&c.storeCode);
}
function normalizedSupabaseUrl(url){return String(url||'').trim().replace(/\/$/,'');}
function cloudHeaders(preferRepresentation=false){
  const c=loadSyncConfig();
  const h={'apikey':c.key,'Authorization':`Bearer ${c.key}`,'Content-Type':'application/json'};
  if(preferRepresentation) h['Prefer']='resolution=merge-duplicates,return=representation';
  return h;
}
function buildCloudPayload(){
  return {
    data:loadData(),
    targets:loadTargets(),
    lineText:loadLineText(),
    version:11,
    savedAt:new Date().toISOString()
  };
}
function applyCloudPayload(payload){
  if(!payload||typeof payload!=='object') return false;
  if(payload.data) localStorage.setItem('sellnavi_data',JSON.stringify(payload.data));
  if(payload.targets) localStorage.setItem('sellnavi_targets',JSON.stringify({...DEFAULT_TARGETS,...payload.targets}));
  if(typeof payload.lineText==='string') localStorage.setItem(LINE_TEXT_KEY,payload.lineText);
  refreshLineNumbersInStorage();
  return true;
}
async function fetchCloudRecord(){
  if(!syncConfigured()) return null;
  const c=loadSyncConfig();
  const url=`${normalizedSupabaseUrl(c.url)}/rest/v1/sellnavi_sync?store_code=eq.${encodeURIComponent(c.storeCode)}&select=store_code,payload,updated_at&limit=1`;
  const res=await fetch(url,{headers:cloudHeaders()});
  if(!res.ok) throw new Error(`クラウド取得失敗 (${res.status})`);
  const rows=await res.json();
  return rows?.[0]||null;
}
async function pushCloudData({force=false}={}){
  if(!syncConfigured() || (!cloudSyncReady&&!force)) return false;
  const c=loadSyncConfig();
  const body={store_code:c.storeCode,payload:buildCloudPayload(),updated_at:new Date().toISOString()};
  const url=`${normalizedSupabaseUrl(c.url)}/rest/v1/sellnavi_sync?on_conflict=store_code`;
  const res=await fetch(url,{method:'POST',headers:cloudHeaders(true),body:JSON.stringify(body)});
  if(!res.ok) throw new Error(`クラウド保存失敗 (${res.status})`);
  let row=null;
  try{const rows=await res.json();row=rows?.[0]||null;}catch{}
  const ts=row?.updated_at||body.updated_at;
  localStorage.setItem(SYNC_LAST_CLOUD_KEY,ts);
  cloudSyncReady=true;
  updateSyncStatus(`同期済み ${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`);
  return true;
}
function scheduleCloudPush(){
  if(!syncConfigured()||!cloudSyncReady) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>pushCloudData().catch(err=>updateSyncStatus(err.message,true)),900);
}
async function pullCloudData({force=false,render=true}={}){
  if(!syncConfigured()) return false;
  const row=await fetchCloudRecord();
  if(!row){
    cloudSyncReady=false;
    updateSyncStatus('クラウドに同期データがありません',true);
    return false;
  }
  const last=localStorage.getItem(SYNC_LAST_CLOUD_KEY)||'';
  if(force || !last || row.updated_at>last){
    applyCloudPayload(row.payload);
    localStorage.setItem(SYNC_LAST_CLOUD_KEY,row.updated_at||new Date().toISOString());
    if(render){
      if(currentTab==='input') renderInput();
      else if(currentTab==='history') renderHistory();
      else if(currentTab==='analysis') renderAnalysis();
      else if(currentTab==='line') renderLine();
    }
  }
  cloudSyncReady=true;
  updateSyncStatus(`同期済み ${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`);
  return true;
}
async function setThisDeviceAsParent(){
  if(!saveSyncSettingsFromForm()) return;
  if(!confirm('この端末の現在データをクラウドの基準データとして登録します。よろしいですか？')) return;
  try{
    cloudSyncReady=true;
    await pushCloudData({force:true});
    showToast('この端末を親データに設定しました ✓');
    startCloudPolling();
  }catch(err){cloudSyncReady=false;updateSyncStatus(err.message,true);alert(err.message);}
}
async function importFromCloud(){
  if(!saveSyncSettingsFromForm()) return;
  if(!confirm('この端末の古いデータをクラウドの最新データに置き換えます。よろしいですか？')) return;
  try{
    await pullCloudData({force:true,render:true});
    showToast('クラウドの最新データを反映しました ✓');
    startCloudPolling();
  }catch(err){updateSyncStatus(err.message,true);alert(err.message);}
}
function saveSyncSettingsFromForm(showToastMessage=false){
  const url=document.getElementById('sync-url')?.value.trim()||'';
  const key=document.getElementById('sync-key')?.value.trim()||'';
  const storeCode=document.getElementById('sync-store')?.value.trim()||'';
  if(!url||!key||!storeCode){alert('Supabase URL・Publishable Key・店舗コードをすべて入力してください');return false;}
  saveSyncConfig({url:normalizedSupabaseUrl(url),key,storeCode});
  cloudSyncReady=false;
  if(showToastMessage) showToast('同期設定を保存しました ✓');
  updateSyncStatus('設定保存済み。初回は親端末か受信端末かを選んでください');
  return true;
}
function updateSyncStatus(text,isError=false){
  const el=document.getElementById('sync-status');
  if(el){el.textContent=text;el.style.color=isError?'var(--danger)':'var(--text3)';}
}
function startCloudPolling(){
  clearInterval(cloudPollTimer);
  if(!syncConfigured()) return;
  cloudPollTimer=setInterval(()=>{
    if(document.visibilityState==='visible') pullCloudData({render:true}).catch(err=>updateSyncStatus(err.message,true));
  },15000);
}
async function initCloudSync(){
  if(!syncConfigured()) return;
  try{
    const row=await fetchCloudRecord();
    if(row){
      applyCloudPayload(row.payload);
      localStorage.setItem(SYNC_LAST_CLOUD_KEY,row.updated_at||new Date().toISOString());
      cloudSyncReady=true;
      if(currentTab==='input') renderInput();
      startCloudPolling();
    }else{
      cloudSyncReady=false;
    }
  }catch(err){cloudSyncReady=false;console.warn('Cloud sync init failed',err);}
}
window.addEventListener('focus',()=>{if(syncConfigured()&&cloudSyncReady) pullCloudData({render:true}).catch(()=>{});});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncConfigured()&&cloudSyncReady) pullCloudData({render:true}).catch(()=>{});});

// ══════════════════════════════════════════
// SETTINGS PAGE
// ══════════════════════════════════════════
function renderSettings() {
  const targets=loadTargets();
  const el=document.getElementById('page-settings');
  const rows=METRICS.map(m=>{
    const chip=m.monthly?'<span class="info-chip">単月</span>':'<span class="info-chip">四半期</span>';
    if(targets[m.key]===null){
      return `<div class="setting-row"><span class="setting-name">${m.name}${chip}</span><span style="font-size:12px;color:var(--text3)">目標なし</span></div>`;
    }
    return `<div class="setting-row"><span class="setting-name">${m.name}${chip}</span><span class="setting-unit">${m.unit}</span><input type="${isMoneyMetric(m)?'text':'number'}" class="setting-input" id="set-${m.key}" value="${fmtMetric(targets[m.key],m)}" inputmode="${isMoneyMetric(m)?'numeric':'decimal'}" min="0" onfocus="if(${isMoneyMetric(m)})this.value=String(parseTargetVal(this.value))" onblur="if(${isMoneyMetric(m)})this.value=fmtMetric(parseTargetVal(this.value),'${m.key}')"></div>`;
  }).join('');
  const sync=loadSyncConfig();
  el.innerHTML=`
    <div class="section-label">目標値設定</div>
    <div class="card">${rows}</div>
    <button class="settings-save-btn" onclick="saveSettings()">保存</button>

    <div class="section-label">複数端末データ同期</div>
    <div class="card">
      <div class="sync-note"><b>同期設定済み：</b> 通常は自動同期されます。新しい端末を追加したときだけ「クラウドから受け取る」を使用してください。</div>
      <div class="sync-field"><label>Supabase Project URL</label><input id="sync-url" value="${escHtml(sync.url||'')}" placeholder="https://xxxxx.supabase.co"></div>
      <div class="sync-field"><label>Publishable Key（sb_publishable_...）</label><input id="sync-key" value="${escHtml(sync.key||'')}" placeholder="sb_publishable_..."></div>
      <div class="sync-field"><label>店舗コード（全端末で同じ文字）</label><input id="sync-store" value="${escHtml(sync.storeCode||'')}" placeholder="例：nitta"></div>
      <div class="sync-actions" style="grid-template-columns:1fr">
        <button class="sync-btn" onclick="importFromCloud()">クラウドから受け取る</button>
      </div>
      <div class="sync-status" id="sync-status">${syncConfigured()?'同期設定あり':'未設定'}</div>
    </div>
    <div style="height:80px"></div>`;
}
function saveSettings(){
  const targets=loadTargets();
  METRICS.forEach(m=>{const inp=document.getElementById(`set-${m.key}`);if(inp) targets[m.key]=parseTargetVal(inp.value);});
  saveTargets(targets);
  showToast('目標を保存しました ✓');
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
updateHeader();
renderInput();
setTimeout(()=>initCloudSync(),0);
let deferredInstallPrompt=null;

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  const banner=document.getElementById('install-banner');
  if(banner) banner.classList.add('show');
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  const banner=document.getElementById('install-banner');
  if(banner) banner.classList.remove('show');
  showToast('インストールしました ✓');
});

function isInstalledPWA(){
  return window.matchMedia('(display-mode: fullscreen)').matches ||
         window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone===true;
}

async function installPWA(){
  if(!deferredInstallPrompt) return;
  const promptEvent=deferredInstallPrompt;
  deferredInstallPrompt=null;
  await promptEvent.prompt();
  const result=await promptEvent.userChoice;
  if(result.outcome==='accepted'){
    const banner=document.getElementById('install-banner');
    if(banner) banner.classList.remove('show');
  }
}

if(isInstalledPWA()){
  const banner=document.getElementById('install-banner');
  if(banner) banner.classList.remove('show');
}
if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{await navigator.serviceWorker.register('./sw.js?v=12',{scope:'./', updateViaCache:'none'});await navigator.serviceWorker.ready;}catch(err){console.error('Service Worker registration failed',err);}
  });
}
